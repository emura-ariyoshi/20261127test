<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数値確認テスト（GPSなし・第3系）</title>
  <style>
    body { font-family: sans-serif; padding: 16px; line-height: 1.6; }
    input { width: 150px; padding: 6px; font-size: 16px; margin-bottom: 6px; }
    button { padding: 10px 14px; font-size: 15px; margin: 6px 4px 6px 0; }
    .panel { background: #f4f6f8; padding: 12px; border-radius: 8px; margin-top: 12px; }
    .metric { font-size: 19px; font-weight: bold; margin: 4px 0; }
  </style>
</head>
<body>
  <h3>数値確認テスト（第3系・GPSなし）</h3>

  <div>
    現在地 X（北・m）: <input id="cx" type="number" step="0.1" value="-220000.0" /><br />
    現在地 Y（東・m）: <input id="cy" type="number" step="0.1" value="-35000.0" /><br />
    目的 X（北・m）: <input id="tx" type="number" step="0.1" value="-219990.0" /><br />
    目的 Y（東・m）: <input id="ty" type="number" step="0.1" value="-35000.0" />
  </div>

  <button id="btnCalc">計算する</button>
  <button id="btnN10">現在地から北へ10m</button>
  <button id="btnE10">現在地から東へ10m</button>

  <div class="panel" id="result">「計算する」を押してください</div>

  <script>
    const cxEl = document.getElementById("cx");
    const cyEl = document.getElementById("cy");
    const txEl = document.getElementById("tx");
    const tyEl = document.getElementById("ty");
    const resultEl = document.getElementById("result");

    function render() {
      const cx = parseFloat(cxEl.value) || 0;
      const cy = parseFloat(cyEl.value) || 0;
      const tx = parseFloat(txEl.value) || 0;
      const ty = parseFloat(tyEl.value) || 0;

      const dx = tx - cx; // +北, -南
      const dy = ty - cy; // +東, -西
      const dist = Math.hypot(dx, dy);

      // 北=0°, 時計回りに東=90°, 南=180°, 西=270°
      let bearing = (Math.atan2(dy, dx) * 180) / Math.PI;
      if (bearing < 0) bearing += 360;

      resultEl.innerHTML = `
        <div>現在地 X: <b>${cx.toFixed(2)} m</b> / Y: <b>${cy.toFixed(2)} m</b></div>
        <hr />
        <div class="metric">ΔX（北+ / 南-）: ${dx >= 0 ? "+" : ""}${dx.toFixed(2)} m</div>
        <div class="metric">ΔY（東+ / 西-）: ${dy >= 0 ? "+" : ""}${dy.toFixed(2)} m</div>
        <div class="metric">水平距離: ${dist.toFixed(2)} m</div>
        <div class="metric">目的の方角（北0°・時計回り）: ${bearing.toFixed(1)}°</div>
      `;
    }

    document.getElementById("btnCalc").addEventListener("click", render);

    document.getElementById("btnN10").addEventListener("click", () => {
      const cx = parseFloat(cxEl.value) || 0;
      const cy = parseFloat(cyEl.value) || 0;
      txEl.value = (cx + 10).toFixed(2);
      tyEl.value = cy.toFixed(2);
      render();
    });

    document.getElementById("btnE10").addEventListener("click", () => {
      const cx = parseFloat(cxEl.value) || 0;
      const cy = parseFloat(cyEl.value) || 0;
      txEl.value = cx.toFixed(2);
      tyEl.value = (cy + 10).toFixed(2);
      render();
    });

    // 初期表示
    render();
  </script>
</body>
</html>
